# Configuración de la Base de Datos MySQL con Variables de Entorno (Punto 3)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Lubcker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:elefernandez}

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect